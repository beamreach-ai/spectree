name: Spectree (reusable)
# Called from a repository's own workflow. See docs/setup.md.
# It checks out the default branch only. Pull requests are read through the API as data and their code never runs.
on:
  workflow_call:
    secrets:
      # Only for dashboard.host: cloudflare. The deploy job is the only one that sees them.
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

concurrency:
  group: spectree-${{ github.repository }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    outputs:
      dashboard: ${{ steps.run.outputs.dashboard }}
      host: ${{ steps.run.outputs.host }}
      project: ${{ steps.run.outputs.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: run
        uses: beamreach-ai/spectree@v1
      - if: steps.run.outputs.dashboard == 'true' && steps.run.outputs.host != 'cloudflare'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _spectree_site
      - if: steps.run.outputs.dashboard == 'true' && steps.run.outputs.host == 'cloudflare'
        uses: actions/upload-artifact@v4
        with:
          name: spectree-site
          path: _spectree_site
          retention-days: 1

  publish:
    needs: evaluate
    if: needs.evaluate.outputs.dashboard == 'true' && needs.evaluate.outputs.host != 'cloudflare'
    # A repository without GitHub Pages still gets the checks and the vote count.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  publish-cloudflare:
    needs: evaluate
    if: needs.evaluate.outputs.dashboard == 'true' && needs.evaluate.outputs.host == 'cloudflare'
    # Like the GitHub Pages job: a failed deploy does not fail the checks.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spectree-site
          path: site
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ needs.evaluate.outputs.project }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::dashboard.host is cloudflare, but CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID did not reach the workflow. Add them as repository secrets and pass them under secrets: in .github/workflows/spectree.yml (docs/setup.md)."
            exit 1
          fi
          # The first deploy creates the project; later ones find it.
          npx --yes wrangler@4 pages project list 2>/dev/null | grep -qw "$PROJECT" \
            || npx --yes wrangler@4 pages project create "$PROJECT" --production-branch "$BRANCH"
          npx --yes wrangler@4 pages deploy site --project-name "$PROJECT" --branch "$BRANCH" --commit-dirty=true
